      - Build: methods/gcm/build.md
      - Visualize: methods/gcm/plot.md
      - Check Assumptions: methods/gcm/assumptions.md
      - Identification Analysis: methods/gcm/identification.md
    - <font color="#a41034">Structural Causal Models (SCM)</font>: methods/scm.md
      # - Assumptions: methods/scm/assumptions.md
      # - Estimate: methods/scm/estimate.md
      # - Report: methods/scm/report.md
    - <font color="#a41034">Causal Bayesian Networds (CBN)</font>: methods/cbn.md
      # - Assumptions: methods/cbn/assumptions.md
      # - Estimate: methods/cbn/estimate.md
      # - Report: methods/cbn/report.md
    - <font color="#a41034">Selection on Observables (SoO)</font>:
      - Estimate: methods/soo/estimate.md
      - Report: methods/soo/report.md
    - <font color="#a41034">Difference-in-Differences (DiD)</font>:
      - Estimate: methods/did/estimate.md
      - Report: methods/did/report.md
    - <font color="#a41034">Instrumental Variable (IV)</font>:
      - Estimate: methods/iv/estimate.md
      - Report: methods/iv/report.md
    - <font color="#a41034">Regression Discontinuity (RD)</font>:
      - Estimate: methods/rd/estimate.md
