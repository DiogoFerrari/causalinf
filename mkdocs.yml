    - <font color="#a41034">Estimation</font>: usage/estimation.md
    - <font color="#a41034">Summary and Reporting</font>: usage/summary-and-reporting.md
    - <font color="#a41034">Sensitivity Analysis</font>: usage/sensitivity.md
    - <font color="#a41034">Examples</font>: usage/examples.md
    - <font color="#a41034">Simulate Data</font>: usage/simulate-data.md
